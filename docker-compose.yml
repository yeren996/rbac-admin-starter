services:
  postgres:
    image: postgres:16-alpine
    container_name: rbac-admin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rbac_admin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - rbac-admin-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d rbac_admin]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: rbac-admin-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    profiles:
      - optional

volumes:
  rbac-admin-postgres:
